plugins { id 'com.android.application' }

def ciStore = System.getenv('QUIET_SIGNING_STORE')
def uploadNames = ['QUIET_UPLOAD_STORE', 'QUIET_UPLOAD_STORE_PASSWORD', 'QUIET_UPLOAD_ALIAS', 'QUIET_UPLOAD_KEY_PASSWORD']
def uploadValues = uploadNames.collect { System.getenv(it) }
if (uploadValues.any { it } && !uploadValues.every { it }) {
    throw new GradleException('Set all QUIET_UPLOAD_* signing variables, or none for an unsigned release bundle.')
}
android {
    namespace 'com.quiet.launcher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.quiet.launcher'
        minSdk 30
        targetSdk 36
        versionCode 6
        versionName '1.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (ciStore) {
            personalTest {
                storeFile file(ciStore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (uploadValues.every { it }) {
            playUpload {
                storeFile file(uploadValues[0])
                storePassword uploadValues[1]
                keyAlias uploadValues[2]
                keyPassword uploadValues[3]
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadValues.every { it }) signingConfig signingConfigs.playUpload
        }
        sideload {
            initWith release
            signingConfig ciStore ? signingConfigs.personalTest : signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

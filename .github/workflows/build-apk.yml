name: Build and test Android 11+ launcher
'on':
  workflow_dispatch:
  push:
    branches: [main, 'launcher/**']
permissions:
  contents: read
concurrency:
  group: quiet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    env:
      QUIET_SIGNING_STORE: ${{ github.workspace }}/ci-signing/debug.keystore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: actions/cache@v4
        with:
          path: ci-signing/debug.keystore
          key: quiet-debug-signing-explicit-v2
      - name: Ensure persistent debug signing key exists
        run: |
          mkdir -p ci-signing
          if [ ! -f "$QUIET_SIGNING_STORE" ]; then
            keytool -genkeypair -keystore "$QUIET_SIGNING_STORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: gradle --no-daemon :app:assembleRelease :app:assembleDebugAndroidTest :app:lintRelease
      - name: Verify delivered APK signature and permission surface
        run: |
          mkdir -p app/build/reports/release-checks
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > app/build/reports/release-checks/signature.txt
          apkanalyzer manifest print app/build/outputs/apk/release/app-release.apk > app/build/reports/release-checks/manifest.xml
          python3 scripts/check_release_manifest.py app/build/reports/release-checks/manifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Quiet-Launcher-APK-built
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-reports
          path: app/build/reports/
  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        api: [30, 31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Allow this disposable runner to use its emulator accelerator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: Quiet-Launcher-APK-built
          path: tested-apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            if adb shell pm list packages | grep -qx 'package:com.quiet.launcher'; then adb uninstall com.quiet.launcher; fi
            adb install tested-apk/app-release.apk
            python3 scripts/test_home_selection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Device-reports-API-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            home-test-results/
